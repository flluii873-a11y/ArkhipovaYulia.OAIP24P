<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Генератор приветствия</title>
</head>
<body>

<h1>Генератор приветствия</h1>

<form action="/result" method="POST">

    <label>Введите имя:</label>
    <input type="text" name="username" required>

    <br><br>

    <label>Выберите настроение:</label>
    <select name="mood">
        <option value="good">Хорошее</option>
        <option value="normal">Обычное</option>
        <option value="bad">Плохое</option>
    </select>

    <br><br>

    <label>Выберите свой любимый язык программирования:</label>
    <select name="language">
        <option value="Python">Python</option>
        <option value="JS">JavaScript</option>
        <option value="C#">C#</option>
        <option value="Java">Java</option>
    </select>
    <br><br>
    
    <label>Введите ваш возраст:</label>
    <input type="number" name="age" required min="1" max="120">

    <button type="submit">Получить сообщение</button>

</form>

</body>
</html>
